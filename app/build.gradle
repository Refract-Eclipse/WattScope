plugins { id 'com.android.application' }

def appMetadata = new Properties()
rootProject.file('version.properties').withReader('UTF-8') { appMetadata.load(it) }
def releaseKeyPath = System.getenv('WATTSCOPE_KEYSTORE')

android {
    namespace appMetadata.getProperty('namespace')
    compileSdk appMetadata.getProperty('compileSdk').toInteger()
    buildToolsVersion appMetadata.getProperty('buildToolsVersion')
    defaultConfig {
        applicationId appMetadata.getProperty('applicationId')
        minSdk appMetadata.getProperty('minSdk').toInteger()
        targetSdk appMetadata.getProperty('targetSdk').toInteger()
        versionCode appMetadata.getProperty('versionCode').toInteger()
        versionName appMetadata.getProperty('versionName')
        manifestPlaceholders = [appLabel: appMetadata.getProperty('appLabel')]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // Optional local test key. Never include it in a public source archive or Git.
    signingConfigs {
        debug {
            def trialKey = rootProject.file('.toolchain/guidetrial-debug.keystore')
            if (trialKey.exists()) {
                storeFile trialKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        release {
            if (releaseKeyPath) {
                storeFile file(releaseKeyPath)
                storePassword System.getenv('WATTSCOPE_STORE_PASSWORD')
                keyAlias System.getenv('WATTSCOPE_KEY_ALIAS')
                keyPassword System.getenv('WATTSCOPE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            if (releaseKeyPath) signingConfig signingConfigs.release
        }
    }
    testOptions { unitTests.includeAndroidResources = true }
    sourceSets.test.java.srcDirs += '../tests'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

plugins { id 'com.android.application' }

android {
    namespace 'dev.wattscope'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.wattscope'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '1.1.3'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
